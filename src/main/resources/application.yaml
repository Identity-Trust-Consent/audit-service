spring:
  application:
    name: audit-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:10.212.13.208}:${DB_PORT:5432}/${DB_NAME:auditdb}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Welcome@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      initialization-fail-timeout: 0
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: ${AUDIT_SQL_INIT_MODE:always}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

server:
  port: ${AUDIT_SERVICE_PORT:8086}

audit:
  exchange-name: ${AUDIT_EXCHANGE:auditing}
  routing-key: ${AUDIT_ROUTING_KEY:#}
  audit-queue: ${AUDIT_QUEUE:auditing-messages}
  tables:
    records: ${AUDIT_RECORDS_TABLE:audit_records}
